<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OneSpace — Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <h1>OneSpace</h1>

            <p>
                Everything for your project,
                in one space.
            </p>
        </div>


        <form id="loginForm">

            <h2>Log in</h2>

            <label for="loginEmail">
                Email
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="Enter your email"
                required
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-button"
            >
                Log in
            </button>

        </form>


        <p class="auth-switch">
            New to OneSpace?

            <a href="register.html">
                Create an account
            </a>
        </p>

    </div>

</main>


<script src="js/auth.js"></script>

</body>
</html>
